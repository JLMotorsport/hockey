{% extends "base.html" %}
{% block content %}
<h1>Players</h1>
<div class="card">
<table class="data">
  <thead><tr><th>Player</th><th>Pos</th><th>Side</th><th class="num">Price</th><th class="num">Points</th></tr></thead>
  <tbody>
  {% for p in players %}
    <tr><td>{{ p.name }}</td><td><span class="pos pos-{{ p.position }}">{{ p.position }}</span></td><td>{{ p.team.name }}</td><td class="num">{{ p.price_display }}</td><td class="num">{{ season_points.get(p.id, 0) }}</td></tr>
  {% else %}
    <tr><td colspan="5" class="muted">No players added yet.</td></tr>
  {% endfor %}
  </tbody>
</table>
</div>
{% endblock %}
