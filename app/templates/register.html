{% extends "base.html" %}
{% block content %}
<div class="card narrow">
  <h1>Join the league</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Your name <input name="display_name" value="{{ form.get('display_name', '') }}" required></label>
    <label>Email <input type="email" name="email" value="{{ form.get('email', '') }}" required></label>
    <label>Fantasy team name <input name="team_name" value="{{ form.get('team_name', '') }}" maxlength="80" required></label>
    <label>Password <input type="password" name="password" minlength="8" required></label>
    <button class="button">Create account</button>
  </form>
  <p class="muted">Already signed up? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</div>
{% endblock %}
