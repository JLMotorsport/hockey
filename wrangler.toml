# Cloudflare deploy config, same shape as ParkManager. The app is a static SPA:
# no server-side Worker, just the built `dist` served as static assets, with
# single-page-app fallback so client routes (/squad, /manage/...) work.
# Cloudflare's Git integration builds and deploys on every push to main.
name = "felixstowe-fantasy-hockey"
compatibility_date = "2024-11-01"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
