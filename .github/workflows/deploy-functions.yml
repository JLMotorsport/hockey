name: Deploy Supabase functions

# Deploys the eh-sync Edge Function to the hosted Supabase project, so nobody
# has to run the Supabase CLI on their own machine. Runs when the function
# changes on main, or by hand from the Actions tab ("Run workflow").
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN  personal access token from
#                          https://supabase.com/dashboard/account/tokens
#   EH_SYNC_SECRET         any long random string; the scheduler sends it
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**']
  workflow_dispatch:

concurrency:
  group: deploy-functions
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: sovfxpamgrpsjswcjwkt

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check secrets are set
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          EH_SYNC_SECRET: ${{ secrets.EH_SYNC_SECRET }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$EH_SYNC_SECRET" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN and EH_SYNC_SECRET under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Set function secret
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          EH_SYNC_SECRET: ${{ secrets.EH_SYNC_SECRET }}
        run: supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" "EH_SYNC_SECRET=$EH_SYNC_SECRET"

      - name: Deploy eh-sync
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy eh-sync --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --use-api
